include /etc/nginx/security-headers-common.conf;
# Document policy for the SPA shell and static files nginx serves directly.
# Scripts: same-origin bundle and /boot/shell.js, plus the Google Picker loader.
# No inline script or eval is allowed; scripts/check_frontend_headers.py asserts
# these semantics against the built container.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://storage.googleapis.com https://*.sentry.io https://apis.google.com https://content.googleapis.com https://www.googleapis.com; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com https://www.instagram.com https://drive.google.com https://docs.google.com https://accounts.google.com https://www.dropbox.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
