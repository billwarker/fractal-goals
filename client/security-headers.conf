add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Frame-Options "DENY" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com https://www.instagram.com https://drive.google.com https://docs.google.com https://accounts.google.com https://www.dropbox.com; media-src 'self' https:; img-src 'self' data: https:" always;
