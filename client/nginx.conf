map $uri $storage_access_log {
    default 1;
    ~^/api/storage/(google_drive|dropbox)/callback$ 0;
}

server {
    listen 8080;
    # OAuth callback URLs contain single-use credentials; omit them from access logs.
    access_log /var/log/nginx/access.log combined if=$storage_access_log;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # The service worker and its manifest must always revalidate, or a stale
    # worker would pin users to an old app shell for a year.
    location ~ ^/(?:sw\.js|manifest\.webmanifest)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # The boot script is not content-hashed, so it must revalidate like the worker.
    location ^~ /boot/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }

    # Snapshot publication is an intentionally heavier admin operation. Its
    # external delivery calls are tightly bounded by the backend, while this
    # explicit budget prevents Nginx's 60s default from expiring before the
    # backend/Gunicorn request budgets and returning an ambiguous HTML 504.
    location = /api/admin/landing-examples/publish {
        include /etc/nginx/security-headers-common.conf;
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Attests this hop so the backend trusts the forwarded chain (request_identity.py).
        proxy_set_header X-Fractal-Proxy-Token "${TRUSTED_PROXY_SECRET}";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 200s;
        proxy_intercept_errors on;
        error_page 502 503 = @landing_publish_gateway_error;
        error_page 504 = @landing_publish_timeout;
    }

    location @landing_publish_gateway_error {
        default_type application/json;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"The publishing service is temporarily unavailable. Refresh before retrying."}';
    }

    location @landing_publish_timeout {
        default_type application/json;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 504 '{"error":"Publishing took too long at the gateway. The snapshot may still have been saved; refresh before retrying."}';
    }

    location /api/ {
        # The backend owns the CSP of its own documents; keep only the shared headers.
        include /etc/nginx/security-headers-common.conf;
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Attests this hop so the backend trusts the forwarded chain (request_identity.py).
        proxy_set_header X-Fractal-Proxy-Token "${TRUSTED_PROXY_SECRET}";
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # Health check
    location /health {
        access_log off;
        return 200 'healthy';
    }
}
