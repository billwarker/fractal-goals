[package]
name = "fractal-goals"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
tauri-plugin-window-state = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
security-framework = "3.7"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-authentication-services = "0.3"
objc2-user-notifications = "0.3"

[dev-dependencies]
tempfile = "3"

[features]
# Runs a script inside the real app and reports what happened (smoke/run.mjs). Never in a release.
smoke = []

[profile.release]
lto = true
codegen-units = 1
strip = true
