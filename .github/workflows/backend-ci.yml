name: Backend CI

on:
  pull_request: {}
  push:
    branches: ["main"]

jobs:
  migration-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENV: testing
      DATABASE_URL: postgresql://fractal:fractal_dev_password@localhost:5432/fractal_goals
      JWT_SECRET_KEY: test-secret-key
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fractal
          POSTGRES_PASSWORD: fractal_dev_password
          POSTGRES_DB: fractal_goals
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fractal -d fractal_goals"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify fresh schema and metadata parity
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Verify latest migration reversibility
        run: |
          python -m alembic downgrade -1
          python -m alembic upgrade head
          python -m alembic check

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ENV: testing
      DATABASE_URL: postgresql://fractal:fractal_dev_password@localhost:5432/fractal_goals_test
      JWT_SECRET_KEY: test-secret-key
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fractal
          POSTGRES_PASSWORD: fractal_dev_password
          POSTGRES_DB: fractal_goals
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fractal -d fractal_goals"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Audit production dependencies
        run: python -m pip_audit -r requirements.txt --progress-spinner off

      - name: Prepare Postgres test database
        run: |
          python - <<'PY'
          import time
          import psycopg2
          from psycopg2.extensions import ISOLATION_LEVEL_AUTOCOMMIT

          admin_url = "postgresql://fractal:fractal_dev_password@localhost:5432/postgres"
          test_db = "fractal_goals_test"
          last_error = None

          for _ in range(30):
              try:
                  conn = psycopg2.connect(admin_url)
                  conn.set_isolation_level(ISOLATION_LEVEL_AUTOCOMMIT)
                  cur = conn.cursor()
                  cur.execute("SELECT 1 FROM pg_database WHERE datname = %s", (test_db,))
                  if not cur.fetchone():
                      cur.execute(f'CREATE DATABASE "{test_db}"')
                  cur.close()
                  conn.close()
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(1)
          else:
              raise SystemExit(f"Postgres test database was not ready: {last_error}")
          PY

      - name: Syntax and Maintainability
        run: |
          python -m compileall -q blueprints services models validators app.py config.py
          python scripts/check_backend_maintainability.py

      - name: Run Coverage Suite
        run: |
          python scripts/check_backend_coverage_gate.py
          python -m pytest tests/unit tests/integration tests/performance tests/e2e --cov-report=xml --cov-report=html --cov-report=term-missing

      - name: Exercise logical backup and restore
        run: python scripts/check_backup_restore.py

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            coverage.xml
            htmlcov/

  production-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag fractal-backend:ci .
      - name: Verify pinned server and dependency consistency
        run: |
          docker run --rm --entrypoint python fractal-backend:ci -m pip check
          docker run --rm --entrypoint gunicorn fractal-backend:ci --version
