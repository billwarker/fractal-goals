name: Frontend CI

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  frontend:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Frontend Tests and Coverage
        run: npm run test:coverage

      - name: Responsive audit
        run: npm run check:responsive

      - name: Maintainability audit
        run: npm run check:maintainability

      - name: Build
        run: npm run build

      - name: Verify production nginx headers
        run: |
          docker build -t fractal-client:headers .
          python3 ../scripts/check_frontend_headers.py fractal-client:headers

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENV: testing
      DATABASE_URL: postgresql://fractal:fractal_dev_password@localhost:5432/postgres
      JWT_SECRET_KEY: browser-ci-secret
      PYTHON: python
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fractal
          POSTGRES_PASSWORD: fractal_dev_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fractal -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        run: |
          python -m pip install -r ../requirements.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: Build and exercise real application
        run: |
          npm run build
          npm run test:browser
      - name: Enforce the delivered CSP in a real browser
        run: |
          docker build -t fractal-client:csp .
          node scripts/check-csp-enforcement.mjs fractal-client:csp
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: |
            client/test-results/
            client/playwright-report/
