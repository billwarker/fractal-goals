name: Visual Sweep

# Every surface in client/e2e/sweep/manifest.js, failing on horizontal overflow, tap targets
# under 24px and serious axe violations. It runs beside Frontend CI rather than inside it:
# pull requests that touch the client check phones and desktop in both themes (about half the
# captures); the nightly and on-demand runs check every viewport.
on:
  pull_request:
    paths:
      - "client/**"
      - "scripts/browser_test_server.py"
      - "scripts/browser_showcase_seed.py"
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch: {}

jobs:
  sweep:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    # Same database and settings as Frontend CI's browser job.
    env:
      ENV: testing
      DATABASE_URL: postgresql://fractal:fractal_dev_password@localhost:5432/postgres
      JWT_SECRET_KEY: browser-ci-secret
      PYTHON: python
      SWEEP_ENFORCE: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fractal
          POSTGRES_PASSWORD: fractal_dev_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fractal -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        run: |
          python -m pip install -r ../requirements.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: "Sweep (pull request: phones and desktop)"
        if: github.event_name == 'pull_request'
        run: npm run sweep:quick
      - name: Sweep (every viewport)
        if: github.event_name != 'pull_request'
        run: npm run sweep
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-contact-sheet
          path: client/sweep-results/
